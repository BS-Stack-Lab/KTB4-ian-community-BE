spring:
  profiles:
    default: local
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never

jwt:
  issuer: ian-community
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 600
  refresh-token-expiration-seconds: 604800

app:
  runtime: ${APP_RUNTIME:api}
  media:
    enabled: ${MEDIA_V2_ENABLED:false}
    aws-region: ${AWS_REGION:ap-northeast-2}
    bucket: ${MEDIA_BUCKET:}
    queue-url: ${MEDIA_QUEUE_URL:}
    role-arn: ${MEDIA_ROLE_ARN:}
    endpoints:
      s3: ${MEDIA_S3_ENDPOINT:}
      s3-presign: ${MEDIA_S3_PRESIGN_ENDPOINT:}
      sqs: ${MEDIA_SQS_ENDPOINT:}
      cloud-watch: ${MEDIA_CLOUDWATCH_ENDPOINT:}
      s3-path-style: ${MEDIA_S3_PATH_STYLE:false}
    cdn-base-url: ${MEDIA_CDN_BASE_URL:}
    distribution-id: ${MEDIA_DISTRIBUTION_ID:}
    environment-name: ${MEDIA_ENVIRONMENT:local}
    transform-version: ${MEDIA_TRANSFORM_VERSION:1}
    upload-expiration-seconds: 600
    worker:
      scratch-root: ${MEDIA_WORKER_SCRATCH:/var/lib/community/media-worker}
      wait-time-seconds: ${MEDIA_WORKER_WAIT_SECONDS:20}
      visibility-timeout-seconds: ${MEDIA_WORKER_VISIBILITY_SECONDS:300}
      max-receive-count: ${MEDIA_WORKER_MAX_RECEIVE_COUNT:5}
