server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${APP_DATA_PATH:/var/lib/ian-community/data}/community;DB_CLOSE_ON_EXIT=FALSE
    username: ${H2_DATABASE_USERNAME:sa}
    password: ${H2_DATABASE_PASSWORD:}

  h2:
    console:
      enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

app:
  frontend-origin: ${FRONTEND_ORIGIN}
  storage:
    root: ${LOCAL_STORAGE_PATH:/var/lib/ian-community/storage/images}
  cookie:
    secure: true
    same-site: Lax

logging:
  level:
    org.hibernate.SQL: WARN
