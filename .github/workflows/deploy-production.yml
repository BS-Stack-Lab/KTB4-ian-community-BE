name: BE / deploy-production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: deploy or rollback
        type: choice
        required: true
        default: deploy
        options: [deploy, rollback]
      frontend_sha:
        description: Full Frontend main commit SHA (deploy only)
        type: string
        required: false
      frontend_ref:
        description: Frontend full SHA tag or sha256 digest (deploy only)
        type: string
        required: false
      backend_sha:
        description: Full Backend main commit SHA (deploy only)
        type: string
        required: false
      backend_ref:
        description: Backend full SHA tag or sha256 digest (deploy only)
        type: string
        required: false
      rollback_confirmation:
        description: Type rollback-community for rollback
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: pulse-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      config_sha: ${{ steps.resolve.outputs.config_sha }}
      frontend_commit: ${{ steps.resolve.outputs.frontend_commit }}
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
      backend_commit: ${{ steps.resolve.outputs.backend_commit }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}
    steps:
      - name: Checkout current trusted Backend main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate source commits and immutable images before approval
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          BACKEND_REF: ${{ inputs.backend_ref }}
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == refs/heads/main ]]
          config_sha="$(git rev-parse HEAD)"
          [[ "${config_sha}" =~ ^[0-9a-f]{40}$ ]]

          if [[ "${OPERATION}" == rollback ]]; then
            [[ "${ROLLBACK_CONFIRMATION}" == rollback-community ]]
            frontend_sha=''
            frontend_image=''
            backend_sha=''
            backend_image=''
          else
            [[ "${OPERATION}" == deploy ]]
            [[ "${FRONTEND_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${BACKEND_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${FRONTEND_REF}" =~ ^([0-9a-f]{40}|sha256:[0-9a-f]{64})$ ]]
            [[ "${BACKEND_REF}" =~ ^([0-9a-f]{40}|sha256:[0-9a-f]{64})$ ]]
            [[ ! "${FRONTEND_REF}" =~ ^[0-9a-f]{40}$ || "${FRONTEND_REF}" == "${FRONTEND_SHA}" ]]
            [[ ! "${BACKEND_REF}" =~ ^[0-9a-f]{40}$ || "${BACKEND_REF}" == "${BACKEND_SHA}" ]]
            git merge-base --is-ancestor "${BACKEND_SHA}" HEAD
            frontend_status="$(gh api "repos/BS-Stack-Lab/KTB4-ian-community-FE/compare/${FRONTEND_SHA}...main" --jq .status)"
            [[ "${frontend_status}" == ahead || "${frontend_status}" == identical ]]

            require_successful_ci() {
              local repository="$1"
              local source_sha="$2"
              gh api --method GET "repos/${repository}/actions/workflows/ci.yml/runs" \
                -f branch=main -f head_sha="${source_sha}" -f event=push \
                -f status=success -f per_page=100 \
                | jq -e --arg source_sha "${source_sha}" '
                    .workflow_runs
                    | any(
                        .head_sha == $source_sha
                        and .head_branch == "main"
                        and .event == "push"
                        and .status == "completed"
                        and .conclusion == "success"
                      )
                  ' >/dev/null
            }
            resolve_verified_image() {
              local image_repository="$1"
              local source_repository="$2"
              local source_sha="$3"
              local requested_ref="$4"
              local candidate manifest digest resolved labels

              if [[ "${requested_ref}" == sha256:* ]]; then
                candidate="${image_repository}@${requested_ref}"
              else
                [[ "${requested_ref}" == "${source_sha}" ]]
                candidate="${image_repository}:${requested_ref}"
              fi

              manifest="$(docker buildx imagetools inspect "${candidate}" --format '{{json .Manifest}}')"
              digest="$(jq -r '.digest // empty' <<<"${manifest}")"
              [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              jq -e '
                any(
                  .manifests[]?;
                  .platform.os == "linux" and .platform.architecture == "amd64"
                )
              ' <<<"${manifest}" >/dev/null

              resolved="${image_repository}@${digest}"
              labels="$(docker buildx imagetools inspect "${resolved}" --format '{{json .Image.Config.Labels}}')"
              jq -e --arg revision "${source_sha}" \
                --arg source "https://github.com/${source_repository}" '
                  .["org.opencontainers.image.revision"] == $revision
                  and .["org.opencontainers.image.source"] == $source
                ' <<<"${labels}" >/dev/null

              gh attestation verify "oci://${resolved}" \
                --repo "${source_repository}" \
                --signer-workflow "${source_repository}/.github/workflows/publish-image.yml" \
                --source-ref refs/heads/main \
                --source-digest "${source_sha}" \
                --bundle-from-oci >/dev/null
              printf '%s\n' "${resolved}"
            }
            require_successful_ci BS-Stack-Lab/KTB4-ian-community-FE "${FRONTEND_SHA}"
            require_successful_ci BS-Stack-Lab/KTB4-ian-community-BE "${BACKEND_SHA}"
            frontend_sha="${FRONTEND_SHA}"
            backend_sha="${BACKEND_SHA}"
            frontend_image="$(resolve_verified_image \
              ghcr.io/bs-stack-lab/ktb4-ian-community-fe \
              BS-Stack-Lab/KTB4-ian-community-FE \
              "${frontend_sha}" "${FRONTEND_REF}")"
            backend_image="$(resolve_verified_image \
              ghcr.io/bs-stack-lab/ktb4-ian-community-be \
              BS-Stack-Lab/KTB4-ian-community-BE \
              "${backend_sha}" "${BACKEND_REF}")"
          fi

          {
            echo "operation=${OPERATION}"
            echo "config_sha=${config_sha}"
            echo "frontend_commit=${frontend_sha}"
            echo "frontend_image=${frontend_image}"
            echo "backend_commit=${backend_sha}"
            echo "backend_image=${backend_image}"
          } >>"${GITHUB_OUTPUT}"

  production:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://pulse.gleeze.com
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pulse-production-${{ github.run_id }}
      - name: Run serialized deployment through SSM
        env:
          OPERATION: ${{ needs.prepare.outputs.operation }}
          CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
          FRONTEND_COMMIT: ${{ needs.prepare.outputs.frontend_commit }}
          FRONTEND_IMAGE: ${{ needs.prepare.outputs.frontend_image }}
          BACKEND_COMMIT: ${{ needs.prepare.outputs.backend_commit }}
          BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          set -Eeuo pipefail
          [[ "${INSTANCE_ID}" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "${PRODUCTION_ORIGIN}" =~ ^https://[A-Za-z0-9.-]+$ ]]

          if [[ "${OPERATION}" == rollback ]]; then
            remote_command='sudo env ROLLBACK_CONFIRM=rollback-community /opt/community/bin/community-release rollback'
          else
            remote_command="sudo env CONFIG_SHA=${CONFIG_SHA} TARGET_COMPONENT=both PRODUCTION_ORIGIN=${PRODUCTION_ORIGIN} TARGET_FRONTEND_COMMIT=${FRONTEND_COMMIT} TARGET_FRONTEND_IMAGE=${FRONTEND_IMAGE} TARGET_BACKEND_COMMIT=${BACKEND_COMMIT} TARGET_BACKEND_IMAGE=${BACKEND_IMAGE} /opt/community/bin/community-release deploy"
          fi

          parameters="$(jq -cn --arg command "${remote_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "PULSE ${OPERATION} ${CONFIG_SHA}" \
            --timeout-seconds 1800 \
            --parameters "${parameters}" \
            --query 'Command.CommandId' --output text)"
          [[ "${command_id}" =~ ^[0-9a-f-]{36}$ ]]

          status='Pending'
          for _ in {1..180}; do
            status="$(aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          [[ "${status}" == Success ]]
      - name: Verify external production health
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          set -Eeuo pipefail
          healthy=0
          for _ in {1..30}; do
            if [[ "$(curl --fail --silent --show-error --max-time 10 "${PRODUCTION_ORIGIN}/healthz" || true)" == ok ]]; then
              healthy=1
              break
            fi
            sleep 5
          done
          [[ "${healthy}" == 1 ]]
          curl --fail --silent --show-error --max-time 15 --output /dev/null "${PRODUCTION_ORIGIN}/"
          curl --fail --silent --show-error --max-time 15 --output /dev/null "${PRODUCTION_ORIGIN}/api/csrf"
