name: community

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mysql:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE to the approved digest reference}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    user: "999:999"
    group_add: ["20000"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-community}
      MYSQL_USER: ${DB_USERNAME:-community}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-app-password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=40
      - --innodb-buffer-pool-size=320M
      - --performance-schema=OFF
    secrets:
      - source: mysql_root_password
        target: mysql-root-password
      - source: mysql_app_password
        target: mysql-app-password
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/community}/mysql
        target: /var/lib/mysql
    expose: ["3306"]
    networks: [community]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    <<: *default-security
    pids_limit: 256
    mem_limit: 640m
    cpus: 0.75
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=999,gid=999
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the approved digest reference}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    user: "10001:10001"
    group_add: ["20000"]
    environment:
      SPRING_PROFILES_ACTIVE: aws
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-community}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-community}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-8}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the public origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_RUNTIME: api
      MEDIA_V2_ENABLED: ${MEDIA_V2_ENABLED:-false}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-}
      MEDIA_QUEUE_URL: ${MEDIA_QUEUE_URL:-}
      MEDIA_ROLE_ARN: ${MEDIA_API_ROLE_ARN:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_PRESIGN_ENDPOINT: ${MEDIA_S3_PRESIGN_ENDPOINT:-}
      MEDIA_SQS_ENDPOINT: ${MEDIA_SQS_ENDPOINT:-}
      MEDIA_CLOUDWATCH_ENDPOINT: ${MEDIA_CLOUDWATCH_ENDPOINT:-}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-false}
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL:-}
      MEDIA_DISTRIBUTION_ID: ${MEDIA_DISTRIBUTION_ID:-}
      MEDIA_ENVIRONMENT: ${MEDIA_ENVIRONMENT:-production}
      MEDIA_TRANSFORM_VERSION: ${MEDIA_TRANSFORM_VERSION:-1}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx640m -XX:+ExitOnOutOfMemoryError}
      TZ: UTC
    secrets:
      - source: mysql_app_password
        target: DB_PASSWORD
      - source: jwt_secret
        target: JWT_SECRET
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/community}/uploads
        target: /var/lib/community/uploads
    expose: ["8080"]
    networks: [community]
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    <<: *default-security
    pids_limit: 256
    mem_limit: 900m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "env", "-u", "JAVA_TOOL_OPTIONS", "java", "-Xms16m", "-Xmx32m", "-cp", "/app/healthcheck", "HealthCheck"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    logging: *default-logging

  media-worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the approved digest reference}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    user: "10001:10001"
    group_add: ["20000"]
    environment:
      SPRING_PROFILES_ACTIVE: aws
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_RUNTIME: worker
      MEDIA_V2_ENABLED: "true"
      MEDIA_BUCKET: ${MEDIA_BUCKET:?Set MEDIA_BUCKET to the CloudFormation output}
      MEDIA_QUEUE_URL: ${MEDIA_QUEUE_URL:?Set MEDIA_QUEUE_URL to the CloudFormation output}
      MEDIA_ROLE_ARN: ${MEDIA_WORKER_ROLE_ARN:?Set MEDIA_WORKER_ROLE_ARN to the CloudFormation output}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_PRESIGN_ENDPOINT: ${MEDIA_S3_PRESIGN_ENDPOINT:-}
      MEDIA_SQS_ENDPOINT: ${MEDIA_SQS_ENDPOINT:-}
      MEDIA_CLOUDWATCH_ENDPOINT: ${MEDIA_CLOUDWATCH_ENDPOINT:-}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-false}
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL:?Set MEDIA_CDN_BASE_URL to the CloudFormation output}
      MEDIA_DISTRIBUTION_ID: ${MEDIA_DISTRIBUTION_ID:?Set MEDIA_DISTRIBUTION_ID to the CloudFormation output}
      MEDIA_ENVIRONMENT: ${MEDIA_ENVIRONMENT:-production}
      MEDIA_TRANSFORM_VERSION: ${MEDIA_TRANSFORM_VERSION:-1}
      MEDIA_WORKER_SCRATCH: /var/lib/community/media-worker
      MEDIA_WORKER_WAIT_SECONDS: ${MEDIA_WORKER_WAIT_SECONDS:-20}
      MEDIA_WORKER_VISIBILITY_SECONDS: ${MEDIA_WORKER_VISIBILITY_SECONDS:-300}
      MEDIA_WORKER_MAX_RECEIVE_COUNT: ${MEDIA_WORKER_MAX_RECEIVE_COUNT:-5}
      MAGICK_TEMPORARY_PATH: /var/lib/community/media-worker
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-community}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-community}
      DB_POOL_MAX_SIZE: 3
      DB_POOL_MIN_IDLE: 1
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the public origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx320m -XX:+ExitOnOutOfMemoryError
      TZ: UTC
    secrets:
      - source: mysql_app_password
        target: DB_PASSWORD
      - source: jwt_secret
        target: JWT_SECRET
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/community}/media-worker
        target: /var/lib/community/media-worker
    networks: [community]
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    stop_grace_period: 130s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
    <<: *default-security
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/community/media-worker/heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /var/lib/community/media-worker/heartbeat))) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the approved digest reference}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    user: "101:101"
    expose: ["8080"]
    networks: [community]
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101
    <<: *default-security
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to the approved digest reference}
    platform: linux/amd64
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    user: "101:101"
    group_add: ["20001"]
    ports:
      - target: 8080
        published: "${HTTP_PORT:-80}"
        host_ip: ${HTTP_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
      - target: 8443
        published: "${HTTPS_PORT:-443}"
        host_ip: ${HTTPS_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
    networks: [community]
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      frontend:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ${COMPOSE_ROOT:-/opt/community/deployment/ec2-compose}/nginx/nginx.prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${TLS_DIR:-/etc/community/tls}
        target: /etc/nginx/tls
        read_only: true
      - type: bind
        source: ${ACME_ROOT:-/data/community/acme}
        target: /var/www/certbot
        read_only: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101
    <<: *default-security
    pids_limit: 128
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

networks:
  community:
    driver: bridge

secrets:
  mysql_root_password:
    file: ${SECRETS_DIR:-/etc/community/secrets}/mysql-root-password
  mysql_app_password:
    file: ${SECRETS_DIR:-/etc/community/secrets}/mysql-app-password
  jwt_secret:
    file: ${SECRETS_DIR:-/etc/community/secrets}/jwt-secret
